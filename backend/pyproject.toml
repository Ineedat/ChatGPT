[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logsanitizer"
version = "0.1.0.dev0"
description = "Offline-first local application for sanitizing application logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "regex>=2024.11.6"]

[project.optional-dependencies]
dev = ["httpx2>=1.0", "pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
