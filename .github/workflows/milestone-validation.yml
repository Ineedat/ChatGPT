name: Milestone validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/milestone-validation.yml"
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch containing the application source to validate
        required: true
        type: string
        default: main
      run_5gb_benchmark:
        description: Run the full synthetic 5-GiB streaming benchmark
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: milestone-validation-${{ inputs.source_branch }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: 5-GiB benchmark (Linux)
    if: inputs.run_5gb_benchmark || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - name: Run synthetic 5-GiB benchmark
        run: python packaging/benchmark_sanitizer.py --size-gib 5 --work-dir .benchmark-5gb

  portable:
    name: Portable build and smoke tests (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
          - os: windows-latest
            os_name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e "backend[dev,ldap,packaging]"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m PyInstaller --clean --noconfirm packaging/logsanitizer.spec
      - run: python packaging/smoke_test.py
      - run: python packaging/network_smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: LogSanitizer-portable-${{ matrix.os_name }}
          path: dist/LogSanitizer/
          if-no-files-found: error
          retention-days: 30
