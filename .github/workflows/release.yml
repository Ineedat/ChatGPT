name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build portable ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
          - os: windows-latest
            os_name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e "backend[dev,ldap,packaging]"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m PyInstaller --clean --noconfirm packaging/logsanitizer.spec
      - run: python packaging/smoke_test.py
      - name: Package portable archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../LogSanitizer-portable-Linux.zip LogSanitizer
      - name: Package portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/LogSanitizer -DestinationPath LogSanitizer-portable-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os_name }}
          path: LogSanitizer-portable-${{ matrix.os_name }}.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: release-assets
          merge-multiple: true
      - name: Publish release and attach portable archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LogSanitizer ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*.zip
