name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - if: runner.os != 'Windows'
        run: pytest
      - if: runner.os == 'Windows'
        run: pytest tests/test_mapping_encryption.py
      - run: ruff check src tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm test
      - run: npm run build

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e "backend[dev,ldap,packaging]"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m PyInstaller --clean --noconfirm packaging/logsanitizer.spec
      - run: python packaging/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: LogSanitizer-portable-${{ runner.os }}
          path: dist/LogSanitizer/
          if-no-files-found: error
